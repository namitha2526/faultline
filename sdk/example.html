<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faultline JS SDK Demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 600px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
    h1 { margin-top: 0; color: #38bdf8; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 16px; margin: 8px 4px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    pre { background: #0f172a; padding: 12px; border-radius: 8px; color: #a5b4fc; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Faultline SDK Demo</h1>
    <p>Semantic Error Intelligence in Action.</p>
    <p>API Endpoint: <code>http://localhost:8000/api/errors</code></p>

    <div>
      <button class="btn-danger" onclick="triggerUncaughtError()">1. Trigger window.onerror</button>
      <button class="btn-danger" onclick="triggerUnhandledPromise()">2. Trigger unhandledrejection</button>
      <button onclick="triggerManualCapture()">3. Faultline.captureException()</button>
    </div>

    <h3>Latest Action Log:</h3>
    <pre id="log">Waiting for actions...</pre>
  </div>

  <script src="./faultline.js"></script>
  <script>
    // Initialize Faultline SDK with demo API key
    Faultline.init({
      apiKey: "fl_demo_key_9f8e7d6c5b4a",
      endpoint: "http://localhost:8000",
      release: "1.0.0-web",
      debug: true
    });

    function log(msg) {
      document.getElementById('log').innerText = new Date().toLocaleTimeString() + ' - ' + msg;
    }

    function triggerUncaughtError() {
      log("Triggering uncaught runtime exception...");
      setTimeout(() => {
        // Deliberately trigger TypeError
        window.nonExistentObject.triggerError();
      }, 50);
    }

    function triggerUnhandledPromise() {
      log("Triggering unhandled Promise rejection...");
      new Promise((resolve, reject) => {
        setTimeout(() => {
          reject(new Error("Payment gateway connection reset during tokenization"));
        }, 50);
      });
    }

    function triggerManualCapture() {
      try {
        throw new RangeError("Maximum call stack exceeded in tree traversal");
      } catch (err) {
        log("Captured manually via Faultline.captureException()");
        Faultline.captureException(err, { userId: "user_4920" });
      }
    }
  </script>
</body>
</html>
